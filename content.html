<style>
    body {
        width: 350px;
    }

    .main {
        display: block;
        margin: auto;
        border-top: 1px solid grey;
        border-bottom: 1px solid grey;
        padding: 8px 0;
    }

    .statusIcon {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 20px;
        height: 20px;
        color: white;
        border-radius: 50%;
        background-color: grey;
    }

        background-color: red;

    .statusIcon.good {

    }

        color: rgb(48, 155, 255);

    }
    a.link:hover {
